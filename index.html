<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="apple-mobile-web-app-title" content="CHECKPOINT demo">
<meta name="application-name" content="CHECKPOINT demo">
<title>CHECKPOINT demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261004eg">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
    <canvas id="game-dots" class="dots"></canvas>
    <canvas id="game-boards"></canvas>
    <div id="scanlines"></div>

    <div id="hud">
      <div>
        <div class="label">SKÓRE</div><div id="score">0</div>
        <div class="label">km/h</div><div id="speed">0</div>
      </div>
      <div class="right"><div class="label">REKORD</div><div id="best">0</div></div>
    </div>

    <!-- dev: jump to places on the track (CONFIG.devButtons) -->
    <div id="devjump" class="hidden">
      <button data-m="0">START</button>
      <button data-m="260">BENZÍNKA 1</button>
      <button data-m="1160">BENZÍNKA 2</button>
      <button data-m="1380">MOST</button>
      <button data-m="2000">PATTAYA</button>
      <button data-m="2060">BENZÍNKA 3</button>
      <button data-m="4950">DÁLNICE</button>
    </div>

    <!-- the car radio (js/world/highway.js): the song whose sign was just passed -->
    <div id="radio" class="radio hidden"></div>

    <!-- sound on / off (also the M key) -->
    <button id="mute" type="button" aria-label="Ztlumit zvuk" aria-pressed="false">
      <svg viewBox="0 0 16 12" shape-rendering="crispEdges" aria-hidden="true">
        <path d="M1 4h3v4H1zM4 4h1V3h1V2h1V1h1v10H7v-1H6V9H5V8H4z"/>
        <path class="waves" d="M10 5h1v2h-1zM11 3h1v1h-1zM11 8h1v1h-1zM12 4h1v4h-1zM13 2h1v1h-1zM13 9h1v1h-1zM14 3h1v6h-1z"/>
        <path class="cross" d="M10 3h1v1h-1zM11 4h1v1h-1zM12 5h1v2h-1zM13 4h1v1h-1zM14 3h1v1h-1zM11 7h1v1h-1zM10 8h1v1h-1zM13 7h1v1h-1zM14 8h1v1h-1z"/>
      </svg>
    </button>

    <div id="gameover" class="overlay hidden">
      <canvas id="gameover-fx" role="img" aria-label="GAME OVER – HIGH SCORES"></canvas>
      <div class="board hidden" id="board-over"></div>
      <div class="sub" id="gameover-info"></div>
      <div class="sub blink">MEZERNÍK / KLEPNI PRO NOVOU JÍZDU</div>
    </div>

    <!-- leaderboard sign-up: nickname + e-mail (for contacting the winners) -->
    <div id="account" class="overlay account hidden">
      <form id="acc-form" autocomplete="on" novalidate>
        <div class="acc-title lettering">LEADERBOARD SIGNUP</div>
        <input id="acc-nick" name="nickname" maxlength="16" placeholder="přezdívka" autocomplete="nickname" spellcheck="false">
        <input id="acc-email" name="email" type="email" maxlength="254" placeholder="e-mail" autocomplete="email" spellcheck="false">
        <label class="acc-consent"><input id="acc-consent" type="checkbox"> souhlasím se zpracováním osobních údajů</label>
        <div id="acc-error" class="acc-error"></div>
        <button id="acc-submit" type="submit">hrát</button>
        <button id="acc-skip" type="button">PŘESKOČIT</button>
        <a href="#" id="acc-offline" class="acc-offline hidden">HRÁT BEZ ŽEBŘÍČKU</a>
      </form>
    </div>
    <!-- checkpoint: the screen goes black with a pixel-art title, then the next level starts -->
    <!-- loading screen: the night skyline slides past behind LOADING… / CLICK TO START (like Drive); a click runs the
         title sequence in its canvas, which waits with what to press above the word, then the game -->
    <div id="loading" class="overlay loading">
      <canvas id="loading-canvas" width="640" height="360"></canvas>
      <canvas id="loading-dots" class="dots"></canvas>
      <div id="loading-prompt" class="load-prompt lettering solid">MEZERNÍK / KLEPNI PRO START</div>
      <div id="loading-start" class="load-start">LOADING…</div>
    </div>

    <!-- the intro before the first run: chevrons lighting up one after another
         like a road sign (first right, then left) – nothing else -->
    <div id="tutorial" class="overlay hidden">
      <div class="tut-card" id="tutorial-card">
        <div class="tut-chevrons" aria-hidden="true">
          <svg viewBox="0 0 7 9" shape-rendering="crispEdges"><path d="M0 0h3v1H0zM1 1h3v1H1zM2 2h3v1H2zM3 3h3v1H3zM4 4h3v1H4zM3 5h3v1H3zM2 6h3v1H2zM1 7h3v1H1zM0 8h3v1H0z"/></svg>
          <svg viewBox="0 0 7 9" shape-rendering="crispEdges"><path d="M0 0h3v1H0zM1 1h3v1H1zM2 2h3v1H2zM3 3h3v1H3zM4 4h3v1H4zM3 5h3v1H3zM2 6h3v1H2zM1 7h3v1H1zM0 8h3v1H0z"/></svg>
          <svg viewBox="0 0 7 9" shape-rendering="crispEdges"><path d="M0 0h3v1H0zM1 1h3v1H1zM2 2h3v1H2zM3 3h3v1H3zM4 4h3v1H4zM3 5h3v1H3zM2 6h3v1H2zM1 7h3v1H1zM0 8h3v1H0z"/></svg>
        </div>
      </div>
    </div>

    <!-- petrol station: shown once the car has stopped by the pump -->
    <div id="station-hint" class="overlay hidden"><div class="sub blink" style="position:absolute;bottom:6%">KLEPNI / MEZERNÍK PRO POKRAČOVÁNÍ</div></div>

    <!-- dev mode (key O): free camera -->
    <div id="dev" class="hidden"></div>

    <!-- touch hint: the two halves of the screen steer (shown on touch screens only) -->
    <div id="touch-hint"><span>◀</span><span>▶</span></div>

    <div id="checkpoint" class="overlay blackout hidden">
      <div class="cp-title" data-text="CHECKPOINT">CHECKPOINT</div>
      <div class="sub" id="checkpoint-level"></div>
    </div>
  </div>
</div>

<!-- phones held upright: ask to turn the phone (a pixel phone in green and black) -->
<div id="rotate"><svg class="rotate-icon" viewBox="0 0 12 18" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h10v1h1v16h-1v1H1v-1H0V1h1z"/><rect class="screen" x="1" y="2" width="10" height="13"/><rect x="2" y="3" width="2" height="2"/><rect x="5" y="3" width="2" height="2" class="dim"/><rect x="8" y="3" width="2" height="2"/><rect x="2" y="6" width="2" height="2" class="dim"/><rect x="5" y="6" width="2" height="2"/><rect x="8" y="6" width="2" height="2"/><rect x="2" y="9" width="2" height="2"/><rect x="5" y="9" width="2" height="2"/><rect x="8" y="9" width="2" height="2" class="dim"/><rect x="2" y="12" width="2" height="2"/><rect x="5" y="12" width="2" height="2" class="dim"/><rect x="8" y="12" width="2" height="2"/><rect class="screen" x="5" y="16" width="2" height="1"/></svg><div>OTOČ TELEFON NA ŠÍŘKU</div></div>
